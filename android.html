/* NAVBAR */
nav{

/* CONTAINER */
.container{

h1{

/* SEARCH */

    border-radius:10px;

    font-size:16px;
    margin-bottom:30px;
    outline:none;
}

/* GAME CARD */
.game{
    display:flex;
    align-items:center;
    background:#1a1a1a;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,255,213,0.2);
    transition:0.4s;
}
.game:hover{
    transform:scale(1.03);
    box-shadow:0 0 35px rgba(0,255,213,0.5);
}

/* ICON */
.game img{
    width:80px;
    height:80px;
    border-radius:15px;
    object-fit:cover;
    margin-left:15px;
    transition:0.3s;
}
.game img:hover{
    transform:scale(1.1);
}

/* INFO */
.game-info{
    flex:1;
}
.game-info h2{
    margin:0;
    font-size:22px;
    color:#00ffd5;
}
.game-info span{
    color:#aaa;
    font-size:14px;
}
.downloads-count{
    color:#00ffd5;
    font-size:14px;
    margin-top:5px;
}

/* DOWNLOAD BUTTON */
.download{
    background:#00ffd5;
    color:#000;
    text-decoration:none;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
    margin-left:15px;
    cursor:pointer;
    transition:0.3s;
}
.download:hover{
    background:#00cbb0;
    transform:scale(1.05);
}

/* MODAL */
#modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:1000;
}
#modalContent{
    background:#1a1a1a;
    padding:30px;
    border-radius:20px;
    width:420px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,255,213,0.5);
    animation:modalFade 0.3s ease-in-out;
}
@keyframes modalFade{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
}
#modalContent h2{
    margin-top:0;
    margin-bottom:12px;
    color:#00ffd5;
}
#modalContent p{
    margin:6px 0;
    color:#ccc;
}
.modal-buttons{
    margin-top:20px;
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:12px;
}
.modal-buttons a{
    padding:12px 18px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
    color:#000;
    transition:0.3s;
}
.modal-buttons a.pixeldrain{
    background:#00ffd5;
}
.modal-buttons a.mediafire{
    background:#ff9900;
}
.modal-buttons a:hover{
    opacity:0.9;
    transform:scale(1.05);
}
#closeModal{
    margin-top:20px;
    padding:10px 16px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}
#closeModal:hover{
    background:#00ffd5;
    color:#000;
}
</style>

<script>
// البحث عن الألعاب
function searchGame(){
    let input = document.querySelector(".search-box").value.toLowerCase();
    let games = document.querySelectorAll(".game");
    games.forEach(game=>{
        let title = game.querySelector("h2").innerText.toLowerCase();
        game.style.display = title.includes(input) ? "flex" : "none";
    });
}

// عداد التحميلات
const API_URL = 'https://script.google.com/macros/s/AKfycbxI3nHfL36wlWTSin1_7OlFZTYGO8sLpaEHwntKlB34_H2fo_Eo9IMfl8Vv8nvCYGpb/exec';

document.querySelectorAll('.game').forEach(game=>{
    const gameID = game.dataset.gameid;
    const countEl = document.getElementById('count-' + gameID);
    const downloadBtn = game.querySelector('.download');

    // جلب العدد عند تحميل الصفحة
    fetch(`${API_URL}?action=get&game=${gameID}`)
        .then(r=>r.text())
        .then(count=>{
            countEl.textContent = "تحميلات: " + count;
        });

    // عند الضغط على زر التحميل (يفتح المودال)
    downloadBtn.addEventListener('click', ()=>{
        document.getElementById('modal').style.display='flex';
        document.getElementById('modalTitle').textContent = game.querySelector('h2').innerText;
        document.getElementById('btnPixeldrain').href = game.dataset.pixeldrain;
        document.getElementById('btnMediafire').href = game.dataset.mediafire;

        // زيادة التحميل
        fetch(`${API_URL}?action=increment&game=${gameID}`)
            .then(r=>r.text())
            .then(count=>{
                countEl.textContent = "تحميلات: " + count;
            });
    });
});

// إغلاق المودال
document.getElementById('closeModal').addEventListener('click', ()=>{
    document.getElementById('modal').style.display='none';
});

// إغلاق المودال عند الضغط خارج المحتوى
document.getElementById('modal').addEventListener('click', e=>{
    if(e.target==document.getElementById('modal')){
        document.getElementById('modal').style.display='none';
    }
});
</script>
