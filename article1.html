<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مغامرة الألغاز | SEKO VIP GAMES</title>
  <!-- خطوط عصرية متناسقة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Changa:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== متغيرات الألوان المتناسقة ========== */
    :root {
      --deep-bg: #06060f;
      --card-bg: rgba(14, 14, 30, 0.75);
      --neon-cyan: #00f0d4;
      --electric-blue: #3b6bff;
      --royal-purple: #9d4edd;
      --gold: #f0b90b;
      --soft-white: #f0f4ff;
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Changa', sans-serif;
      background: radial-gradient(ellipse at 30% 10%, #0a0c1a 0%, #02010a 80%);
      color: var(--soft-white);
      overflow-x: hidden;
      perspective: 1400px;
      scroll-behavior: smooth;
      line-height: 1.9;
    }

    /* خلفية ثلاثية الأبعاد متحركة ومتناسقة */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(157, 78, 221, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 240, 212, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(240, 185, 11, 0.08) 0%, transparent 40%);
      z-index: -2;
      animation: bgMorph 15s infinite alternate;
      pointer-events: none;
    }

    @keyframes bgMorph {
      0% { opacity: 0.7; transform: scale(1) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.15) rotate(1deg); }
    }

    .grid-3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(59, 107, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(157, 78, 221, 0.07) 1px, transparent 1px);
      background-size: 70px 70px;
      transform: rotateX(60deg) scale(2.5);
      z-index: -1;
      animation: gridShift 25s infinite linear;
      pointer-events: none;
    }

    @keyframes gridShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 140px, 140px 0; }
    }

    /* ========== NAVBAR متناسق ========== */
    nav {
      background: rgba(8, 8, 22, 0.8);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 40px;
      box-shadow: 0 20px 50px rgba(0, 240, 212, 0.25), 0 0 0 1px rgba(157, 78, 221, 0.5);
      position: sticky;
      top: 12px;
      margin: 15px 30px;
      border-radius: 100px;
      z-index: 1000;
      transform-style: preserve-3d;
      animation: navFloat 5s infinite ease-in-out;
      border: 1px solid var(--neon-cyan);
      gap: 25px;
      flex-wrap: wrap;
    }

    @keyframes navFloat {
      0%, 100% { transform: translateY(0) rotateX(0.3deg); }
      50% { transform: translateY(-6px) rotateX(-0.3deg); }
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 40px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: linear-gradient(135deg, rgba(157,78,221,0.2), rgba(0,240,212,0.15));
      border: 1px solid transparent;
      text-shadow: 0 0 8px var(--neon-cyan);
      position: relative;
      transform-style: preserve-3d;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    nav a::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 40px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--electric-blue));
      opacity: 0;
      z-index: -1;
      transition: opacity 0.4s;
      filter: blur(12px);
    }

    nav a:hover {
      color: #000;
      background: var(--gold);
      border-color: var(--gold);
      transform: translateZ(30px) scale(1.15);
      box-shadow: 0 0 50px var(--gold), 0 20px 30px rgba(0,0,0,0.7);
      text-shadow: none;
    }

    nav a:hover::before {
      opacity: 0.8;
    }

    /* ========== HEADER IMAGE 3D ========== */
    .header-image {
      max-width: 1000px;
      margin: 30px auto 10px;
      padding: 0 20px;
      transform-style: preserve-3d;
    }

    .header-image .image-wrapper {
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(157, 78, 221, 0.6);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      transform: rotateX(2deg) translateZ(15px);
      border: 2px solid rgba(0, 240, 212, 0.4);
      position: relative;
    }

    .header-image .image-wrapper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .header-image .image-wrapper:hover {
      transform: rotateX(0deg) translateZ(60px) scale(1.02);
      box-shadow: 0 70px 110px rgba(157, 78, 221, 0.8), 0 0 0 3px var(--gold);
      border-color: var(--gold);
    }

    .header-image img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
      transition: 0.6s;
      filter: brightness(0.9);
    }

    .header-image .image-wrapper:hover img {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    /* ========== CONTENT CARD 3D ========== */
    .container {
      max-width: 950px;
      margin: auto;
      padding: 30px 25px 60px;
      transform-style: preserve-3d;
    }

    .content-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border-radius: 50px;
      padding: 45px 35px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(157, 78, 221, 0.5);
      border: 1px solid rgba(0, 240, 212, 0.3);
      transform-style: preserve-3d;
      transform: rotateX(1deg) translateZ(10px);
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    .content-card::before {
      content: "";
      position: absolute;
      top: -30%;
      right: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(0, 240, 212, 0.05) 0%, transparent 70%);
      transform: rotate(30deg);
      pointer-events: none;
    }

    .content-card:hover {
      transform: rotateX(0deg) translateZ(45px);
      box-shadow: 0 60px 100px rgba(157, 78, 221, 0.7), 0 0 0 2px var(--gold);
      background: rgba(20, 20, 40, 0.9);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 3.5rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(135deg, var(--neon-cyan), var(--electric-blue), var(--royal-purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 45px rgba(157, 78, 221, 0.9));
      animation: titleGlow 3s infinite alternate, floatText 5s infinite ease-in-out;
      letter-spacing: 3px;
      transform: translateZ(50px);
    }

    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 35px var(--royal-purple)); }
      100% { filter: drop-shadow(0 0 75px var(--electric-blue)); }
    }

    @keyframes floatText {
      0%, 100% { transform: translateZ(40px) translateY(0); }
      50% { transform: translateZ(70px) translateY(-10px); }
    }

    p {
      color: #cfd8ff;
      font-size: 1.15rem;
      text-align: justify;
      text-indent: 30px;
      margin-bottom: 25px;
      transform: translateZ(20px);
      transition: all 0.3s;
    }

    p:hover {
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    /* ========== FEATURES LIST 3D ========== */
    .features-list {
      margin: 25px 0 15px;
      list-style: none;
      transform: translateZ(30px);
    }

    .features-list li {
      margin-bottom: 18px;
      font-size: 1.2rem;
      color: var(--soft-white);
      padding: 18px 25px;
      background: rgba(59, 107, 255, 0.05);
      border-radius: 25px;
      border-right: 5px solid var(--neon-cyan);
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 15px;
      transform-style: preserve-3d;
    }

    .features-list li .feature-icon {
      font-size: 2rem;
      flex-shrink: 0;
      animation: iconBounce 2.5s infinite ease-in-out;
      filter: drop-shadow(0 0 10px var(--neon-cyan));
    }

    @keyframes iconBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-10px) scale(1.15); }
      50% { transform: translateY(0) scale(1); }
      70% { transform: translateY(-5px) scale(1.08); }
    }

    .features-list li:hover {
      background: rgba(59, 107, 255, 0.15);
      transform: translateZ(25px) translateX(-10px);
      border-right-color: var(--gold);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 240, 212, 0.3);
    }

    .features-list li strong {
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold);
      margin-left: 5px;
    }

    .features-list li span {
      color: #cfd8ff;
    }

    /* ========== AD SECTION ========== */
    .ad-wrapper {
      background: rgba(10, 10, 22, 0.6);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      padding: 25px;
      margin: 30px auto;
      max-width: 400px;
      border: 1px solid rgba(157, 78, 221, 0.6);
      box-shadow: 0 0 40px rgba(157, 78, 221, 0.35);
      text-align: center;
      transform-style: preserve-3d;
      transform: translateZ(15px);
      transition: all 0.4s;
    }

    .ad-wrapper:hover {
      box-shadow: 0 0 60px rgba(157, 78, 221, 0.6);
      transform: translateZ(30px);
      border-color: var(--gold);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        gap: 12px;
        border-radius: 40px;
        margin: 10px 15px;
        padding: 15px 20px;
      }

      .header-image .image-wrapper {
        border-radius: 28px;
      }

      .header-image img {
        max-height: 300px;
      }

      .content-card {
        padding: 30px 20px;
        border-radius: 35px;
      }

      h1 {
        font-size: 2.5rem;
      }

      .features-list li {
        font-size: 1rem;
        padding: 14px 18px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      p {
        text-indent: 15px;
        font-size: 1rem;
      }
    }
  </style>
</head>
