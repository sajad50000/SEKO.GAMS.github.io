<script>
// البحث عن الألعاب
function searchGame(){
    let input = document.querySelector(".search-box").value.toLowerCase();
    let games = document.querySelectorAll(".game");
    games.forEach(game=>{
        let title = game.querySelector("h2").innerText.toLowerCase();
        game.style.display = title.includes(input) ? "flex" : "none";
    });
}

// عداد التحميلات
const API_URL = 'https://script.google.com/macros/s/AKfycbxI3nHfL36wlWTSin1_7OlFZTYGO8sLpaEHwntKlB34_H2fo_Eo9IMfl8Vv8nvCYGpb/exec';

document.querySelectorAll('.game').forEach(game=>{
    const gameID = game.dataset.gameid;
    const countEl = document.getElementById('count-' + gameID);
    const downloadBtn = game.querySelector('.download');

    // جلب العدد عند تحميل الصفحة
    fetch(`${API_URL}?action=get&game=${gameID}`)
        .then(r=>r.text())
        .then(count=>{
            countEl.textContent = "تحميلات: " + count;
        });

    // عند الضغط على زر التحميل (يفتح المودال)
    downloadBtn.addEventListener('click', ()=>{
        document.getElementById('modal').style.display='flex';
        document.getElementById('modalTitle').textContent = game.querySelector('h2').innerText;
        document.getElementById('btnPixeldrain').href = game.dataset.pixeldrain;
        document.getElementById('btnMediafire').href = game.dataset.mediafire;

        // زيادة التحميل
        fetch(`${API_URL}?action=increment&game=${gameID}`)
            .then(r=>r.text())
            .then(count=>{
                countEl.textContent = "تحميلات: " + count;
            });
    });
});

// إغلاق المودال
document.getElementById('closeModal').addEventListener('click', ()=>{
    document.getElementById('modal').style.display='none';
});

// إغلاق المودال عند الضغط خارج المحتوى
document.getElementById('modal').addEventListener('click', e=>{
    if(e.target==document.getElementById('modal')){
        document.getElementById('modal').style.display='none';
    }
});
</script>
